function persist(){const d=load(),p=pairs[index],n=Number(score.value);if(score.value!==''&&Number.isInteger(n)&&n>=0&&n<=100)d[p.id]={score:n,notes:notes.value};else delete d[p.id];localStorage.setItem(key(),JSON.stringify(d));}
function next(){persist();index=Math.min(index+1,pairs.length-1);render()} function previous(){persist();index=Math.max(index-1,0);render()}
reviewer.onchange=()=>{index=0;render()};score.onchange=persist;notes.onchange=persist;
function download(){persist();const d=load();if(Object.keys(d).length!==pairs.length){alert('Cần chấm đủ 70 pair trước khi tải CSV.');return}const rows=['pair_id,target_role,resume_text,job_description,score_0_to_100,reviewer_notes'];const q=v=>'"'+String(v??'').replaceAll('"','""')+'"';for(const p of pairs)rows.push([p.id,p.role,p.resume,p.jd,d[p.id].score,d[p.id].notes].map(q).join(','));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([rows.join('\n')],{type:'text/csv;charset=utf-8'}));a.download=`matching-${reviewer.value}.csv`;a.click()} render();</script>
