name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  contract-and-ai-service:
    name: Contract Verification & AI Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "ai-service/requirements.txt"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ai-service/requirements.txt

      - name: Verify OpenAPI Specification Up-To-Date
        run: python scripts/export_openapi.py --check

      - name: Validate evaluation datasets and packaged classifier
        run: |
          python evaluation/scripts/validate_classification_dataset.py
          python evaluation/scripts/validate_matching_dataset.py
          python -c "import joblib; joblib.load('ai-service/models/classifier/classifier_pipeline.joblib')"

      - name: Run schema-only LLM evaluation
        run: python evaluation/scripts/evaluate_llm.py --mode schema-only

      - name: Reproducibility smoke tests use temporary reports
        run: |
          python evaluation/scripts/evaluate_classifier.py --output /tmp/classification-report.md
          python evaluation/scripts/evaluate_matching.py --output /tmp/matching-report.md --allow-pending

      - name: Scan tracked source, Markdown links, and Git history
        run: python scripts/scan_repository.py --check-history

      - name: Run Pytest (Contracts & AI Service)
        run: |
          pytest

  backend-check:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Run Backend Tests
        working-directory: backend
        run: ./gradlew test --no-daemon

  frontend-check:
    name: Frontend Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend type check
        working-directory: frontend
        run: npm run lint

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-runtime:
    name: Docker Model & API Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Set up Python 3.11 for API smoke test
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build and start full Compose stack
        run: docker compose up --build --detach

      - name: Verify full-stack API flows and privacy assertions
        run: python scripts/smoke_stack.py --check-mysql-privacy --check-logs

      - name: Print Compose logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
